---
layout: default
---
<article class="post card">
  <p class="post-date mono">Logbook · {{ page.date | date: "%-d %b %Y" }}</p>
  <h1 class="post-title">{{ page.title }}</h1>
  <div class="post-body">
    {{ content }}
  </div>
  <a class="btn lift" href="{{ '/#blog' | relative_url }}">← Back to the logbook</a>
</article>

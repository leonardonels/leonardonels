<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} — {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Space+Grotesk:wght@500;700&family=Space+Mono:wght@400;700&family=Saira:wdth,wght@125,800&family=IBM+Plex+Mono:wght@500&family=Old+Standard+TT:wght@400;700&family=Courier+Prime:wght@400;700&display=swap">

  <link rel="stylesheet" href="{{ '/assets/styles.css' | relative_url }}">
  <script src="{{ '/assets/script.js' | relative_url }}" defer></script>
</head>
<body>
  <div class="page">
    <div class="container">

      <header class="site-header card">
        <a class="logo" href="{{ '/' | relative_url }}">
          <span class="logo-word">LEO.NELS<span class="accent">_</span></span>
          <span class="mono">Bureau Nels · Flights LN 007</span>
        </a>
        <nav class="site-nav mono" aria-label="Main">
          <a href="{{ '/#work' | relative_url }}">Gate 1 · Work</a>
          {% if site.posts.size > 0 %}
          <a href="{{ '/#blog' | relative_url }}">Gate 2 · Blog</a>
          <a href="{{ '/#about' | relative_url }}">Gate 3 · About</a>
          <a class="nav-accent" href="{{ '/#hire' | relative_url }}">Gate 4 · Say hi</a>
          {% else %}
          <a href="{{ '/#about' | relative_url }}">Gate 2 · About</a>
          <a class="nav-accent" href="{{ '/#hire' | relative_url }}">Gate 3 · Say hi</a>
          {% endif %}
        </nav>
      </header>

      <main class="sections">
        {{ content }}
      </main>

      <footer class="site-footer mono">
        <span>© Leonardo Nels — built with Jekyll, hosted on GitHub Pages</span>
        <span class="footer-links">
          <a href="https://github.com/leonardonels">GitHub</a>
          <a href="https://linkedin.com/in/leonardonels">LinkedIn</a>
          <a href="https://www.instagram.com/leonardonels">Instagram</a>
          <a href="mailto:leonardo.nels.2000@gmail.com">Email</a>
        </span>
      </footer>

    </div>
  </div>
</body>
</html>
